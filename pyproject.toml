[project]
name = "alteia-grid-synth"
version = "0.1.0"
description = "Alteia Synthetic Grid Network Data Generator for GridOS Tier A CDPSM artifacts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0,<0.16",
]

[project.scripts]
grid-synth = "alteia_grid_synth.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alteia_grid_synth"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
